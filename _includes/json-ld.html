<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Restaurant",
        "@id": "{{ site.url }}/#restaurant",
        "name": "This & That Cafe",
        "alternateName": [
          "This and That Indian Cafe",
          "This & That Indian Cafe, Manchester",
          "This 'n' That"
        ],
        "url": "{{ site.url }}/",
        "telephone": "+441618324971",
        "servesCuisine": ["Indian", "Pakistani", "South Asian", "Curry"],
        "priceRange": "£6-£8",
        "currenciesAccepted": "GBP",
        "foundingDate": "1984",
        "image": [
          "{{ site.url }}/assets/banner-1800.jpg",
          "{{ site.url }}/assets/banner-920.jpg"
        ],
        "logo": "{{ site.url }}/assets/banner-920.jpg",
        "sameAs": [
          "https://goo.gl/maps/XSSrN4gfz2L2",
          "https://www.facebook.com/ThisAndThatManchester",
          "http://www.theskinny.co.uk/whats-on/manchester/restaurants/this-that",
          "https://restaurantguru.com/This-and-That-Manchester",
          "https://www.yell.com/biz/this-and-that-manchester-1136510/",
          "https://foursquare.com/v/this--that/4bacb73bf964a5204f063be3",
          "https://www.timeout.com/manchester/restaurants-and-cafes/this-that",
          "https://www.zomato.com/manchester/this-that-northern-quarter/menu",
          "https://www.happycow.net/reviews/this-that-cafe-manchester-331015",
          "https://www.yelp.com/biz/this-and-that-manchester",
          "https://www.tripadvisor.com/Restaurant_Review-g187069-d732222-Reviews-This_That-Manchester_Greater_Manchester_England.html"
        ],
        "description": "A family run business established in 1984, we’re one of Manchester’s favourite Indian Curry Houses. We offer a huge choice of delicious curries and are located in the heart of the Northern Quarter, tucked away on Soap Street.",
        "slogan": "Home of Rice & Three Curries",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "3 Soap St",
          "addressLocality": "Manchester",
          "addressRegion": "Greater Manchester",
          "postalCode": "M4 1EW",
          "addressCountry": "GB"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 53.484718,
          "longitude": -2.238091
        },
        "areaServed": [
          { "@type": "City", "name": "Manchester" },
          { "@type": "Place", "name": "Northern Quarter, Manchester" }
        ],
        "hasMap": "https://goo.gl/maps/XSSrN4gfz2L2",
        "hasMenu": "{{ site.url }}/menu/",
        "acceptsReservations": false,
        "publicAccess": true,
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Sunday",
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday"
            ],
            "opens": "11:30",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday"],
            "opens": "11:30",
            "closes": "21:00"
          }
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "Rice & 3 Veg Curries (vegan)",
            "price": "6.00",
            "priceCurrency": "GBP"
          },
          {
            "@type": "Offer",
            "name": "Rice & 1 Meat & 2 Veg Curries",
            "price": "6.50",
            "priceCurrency": "GBP"
          },
          {
            "@type": "Offer",
            "name": "Rice & 2 Meat & 1 Veg Curry",
            "price": "7.00",
            "priceCurrency": "GBP"
          },
          {
            "@type": "Offer",
            "name": "Rice & 3 Meat Curries",
            "price": "8.00",
            "priceCurrency": "GBP"
          }
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "reservations",
          "telephone": "+441618324971"
        }
      },
      {
        "@type": "WebSite",
        "@id": "{{ site.url }}/#website",
        "url": "{{ site.url }}/",
        "name": "This & That Indian Cafe, Manchester",
        "inLanguage": "en-GB",
        "publisher": { "@id": "{{ site.url }}/#restaurant" }
      },
      {
        "@type": "{% if layout == 'post' %}Article{% else %}WebPage{% endif %}",
        "@id": "{{ metaPageUrl }}#page",
        "url": "{{ metaPageUrl }}",
        "name": {{ metaPageTitle | dump | safe }},
        "headline": {{ metaPageTitle | dump | safe }},
        "description": {{ metaPageDescription | dump | safe }},
        "inLanguage": "en-GB",
        "isPartOf": { "@id": "{{ site.url }}/#website" },
        "about": { "@id": "{{ site.url }}/#restaurant" },
        "primaryImageOfPage": "{{ metaPageImage }}"
        {%- if layout == 'post' and page.date %},
        "datePublished": "{{ page.date | date }}",
        "dateModified": "{{ page.date | date }}",
        "author": { "@id": "{{ site.url }}/#restaurant" },
        "publisher": { "@id": "{{ site.url }}/#restaurant" },
        "mainEntityOfPage": "{{ metaPageUrl }}"
        {%- endif %}
      }
      {%- if page.url != '/' %},
      {
        "@type": "BreadcrumbList",
        "@id": "{{ metaPageUrl }}#breadcrumb",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "{{ site.url }}/"
          }
          {%- if layout == 'post' %},
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Press & Reviews",
            "item": "{{ site.url }}/news/"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": {{ (title or metaPageTitle) | dump | safe }}
          }
          {%- else %},
          {
            "@type": "ListItem",
            "position": 2,
            "name": {{ (title or metaPageTitle) | dump | safe }}
          }
          {%- endif %}
        ]
      }
      {%- endif %}
    ]
  }
</script>
